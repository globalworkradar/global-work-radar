name: GWR Scheduled Refresh & Deploy

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gwr-scheduled-refresh-deploy.yml

permissions:
  contents: write

concurrency:
  group: gwr-scheduled-refresh-deploy
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical GWR
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Stage current Lever watchlist signals
        run: node ingest-lever.mjs

      - name: Download Workable feed with retry
        run: |
          set -euo pipefail
          rm -f /tmp/workable.xml
          for attempt in 1 2 3 4; do
            echo "Workable download attempt ${attempt}"
            if curl --fail --location --silent --show-error               --connect-timeout 20 --max-time 300               --retry 2 --retry-delay 3 --retry-all-errors               --output /tmp/workable.xml               https://www.workable.com/boards/workable.xml; then
              if grep -q '<job' /tmp/workable.xml && grep -q '</job>' /tmp/workable.xml; then
                echo "Workable feed downloaded: $(wc -c < /tmp/workable.xml) bytes"
                break
              fi
            fi
            rm -f /tmp/workable.xml
            if [ "$attempt" = "4" ]; then
              echo "Workable feed unavailable after retries"
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Ingest Workable
        env:
          WORKABLE_XML_FILE: /tmp/workable.xml
        run: node ingest-workable.mjs

      - name: Build verified public jobs
        run: node build-public-jobs.mjs

      - name: Enrich lifecycle and hiring intent
        run: node enrich-lifecycle.mjs

      - name: Validate outputs
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const zlib=require('zlib');
          const root='data/';
          for (const f of ['staging-lever.json','workable-current.json','workable-market.json','verified-jobs.json']) {
            JSON.parse(fs.readFileSync(root+f,'utf8'));
          }
          if (fs.existsSync(root+'workable-state.json.gz')) {
            JSON.parse(zlib.gunzipSync(fs.readFileSync(root+'workable-state.json.gz')).toString('utf8'));
          }
          const verified=JSON.parse(fs.readFileSync(root+'verified-jobs.json','utf8'));
          if(!verified.records?.length) throw new Error('GWR verified inventory empty');
          if(!verified.generated_at) throw new Error('GWR generated_at missing');
          if(!verified.intelligence) throw new Error('GWR intelligence missing');
          if(!verified.intelligence.lifecycle||!verified.intelligence.hiring_intent) throw new Error('GWR lifecycle/hiring intent summary missing');
          if(!verified.records.every(r=>r.freshness&&r.hiringMomentum&&r.skillSalary&&r.laborBenchmark&&r.lifecycle&&r.hiringIntent)) throw new Error('GWR intelligence fields missing from records');
          if(verified.records.some(r=>r.hiringIntent.is_hiring_probability!==false||r.hiringIntent.is_ghost_job_determination!==false)) throw new Error('GWR hiring intent safety semantics invalid');
          console.log(`GWR_GENERATED_AT=${verified.generated_at}`);
          console.log(`GWR_JOB_COUNT=${verified.records.length}`);
          NODE

      - name: Validate Agent Lab downstream handoff
        run: node agent-lab-handoff.mjs --validate-log

      - name: Validate Publishing downstream handoff
        run: node publishing-handoff.mjs --validate-log

      - name: Record evidence-first observability
        env:
          GWR_BASELINE_REF: HEAD
        run: node observability.mjs

      - name: Remove legacy oversized state/history
        run: |
          rm -f data/workable-state.json
          rm -f data/workable-history.jsonl

      - name: Commit snapshot evidence
        run: |
          set -euo pipefail
          git config user.name "gwr-bot"
          git config user.email "globalworkradar@gmail.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "data(gwr): scheduled market observation snapshot"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "Failed to converge canonical main after retries"
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Handoff deploy to credential bridge
        run: |
          echo "GWR_CANONICAL_REFRESH=PASS"
          echo "GWR_CANONICAL_REPO=globalworkradar/global-work-radar"
          echo "GWR_DEPLOY_BRIDGE=stratumpraxis/vector-praxis-japan::.github/workflows/gwr-cloudflare-deploy.yml"
          echo "Cloudflare credentials remain isolated in the existing deployment runner; canonical code/data stay in this repository."
